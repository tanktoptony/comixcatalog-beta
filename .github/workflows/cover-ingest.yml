name: Cover ingest

# Hourly ComicVine cover ingestion. Changed from a once-a-week Wednesday
# burst to hourly on 2026-08-26 — the weekly design (introduced 2026-08-10
# to replace an every-6-hours cron) could only ever spend a few hours of
# wall-clock time against ComicVine's budget, leaving the rest of the week
# idle. The every-6-hours cron before that got killed because gap-width.json
# / gap-depth.json were stale for 11 weeks, so most cycles just walked past
# an already-exhausted target list. Both problems are fixed now — width/
# depth regenerate weekly with thousands of fresh candidates (see
# weekly-refresh.yml) — so a frequent cadence has real work to do every
# single cycle instead of spinning on nothing.
#
# What runs each cycle, in priority order:
#   1. gap-priority.json   — live launch-gate universe (highest impact)
#   2. gap-featured.json   — homepage carousel curated picks
#   3. gap-manual.json     — ad-hoc adds (Batman/Joker style targeted hunts)
#   4. gap-pinned.json     — series.comicvine_volume_id already confirmed
#                            (see scripts/resolveNeedsVolumeIdBacklog.js) —
#                            fetches the volume directly by id, no title
#                            search, so this lane is close to a guaranteed hit
#   5. gap-width.json      — broadens coverage across new series
#   6. gap-depth.json      — fills in issues for series we already cover
#
# gap-width.json/gap-depth.json are regenerated weekly by weekly-refresh.yml.
# gap-pinned.json is regenerated by gap-probe.yml.
#
# Budget: ComicVine's free tier is ~200 req/hour, ~150k/month (~208/hr
# average). Each SUCCESSFUL match costs ~3 calls (search + volume detail +
# issue list), not 1 — so --max-search-calls per lane below is sized well
# under 200 combined, leaving headroom for that multiplier. Priority/
# featured/manual are ~92%+ saturated already and mostly hit --skip-existing
# for near-zero real cost regardless of their cap; width/depth carry the real
# budget since that's where the actual unexplored territory is. These
# numbers are a first approximation to tune against real hourly data — the
# ingester's own 420 backoff is the actual safety net regardless of these
# caps, and running hourly rather than in one weekly burst means a single
# cycle's miscalibration costs an hour, not a week.
#
# Persistence (changed 2026-08-10): both .ingest-done.json and
# needs_volume_id.json are now git-committed at the end of every run,
# replacing the old GHA-cache-only approach for the done ledger and the
# previously-nonexistent persistence for the needs-volume-id backlog. That
# split (a git-tracked snapshot vs. a cache-only "live" copy that grew
# without ever being committed) was confirmed to be actively losing data —
# needs_volume_id.json's growth was silently discarded every single cycle.
# Now there is exactly one copy of each, always visible in git.
#
# To trigger manually: Actions tab → Cover ingest → Run workflow.
# To pause: comment out the schedule block or disable the workflow in UI.
#
# Health check (added 2026-08-25): every lane step above uses
# continue-on-error, so a run that adds zero covers — the exact failure
# mode that went unnoticed for weeks earlier this month — still shows the
# job as green. The "Check pipeline health" step at the end has no
# continue-on-error: if it fails, the job goes red and GitHub's default
# failure notification actually tells someone. It checks two independent
# things that have both already happened in production: the pipeline going
# silent (checkCoverIngestHealth.js --mode=stall) and ComicVine ingest
# re-introducing the GCD duplicate-title mis-linking bug on a fresh volume
# (--mode=mislink, a repairAllCoverSeriesLinks.js --dry-run pass).
#
# Auto-repair (added 2026-08-26): the mislink bug above had already needed
# three manual repair-script runs this month before the health check even
# existed, and the health check's first real run (2026-08-26) caught a 4th
# occurrence (28 volumes) within hours of shipping. Rather than keep relying
# on a human reading a failure email and running the repair script by hand
# every time, "Auto-repair mis-linked volumes" now runs
# repairAllCoverSeriesLinks.js for real (no --dry-run) right after ingestion,
# every cycle. The health check below is now a safety net that verifies the
# auto-repair actually left things clean, not the primary fix mechanism.
#
# Ledger commit (fixed 2026-08-26): comicvine_api_to_supabase.py rewrites
# comicvine_api_output/issues_uploaded.csv (mode "w") on every invocation,
# and that file is git-tracked. The commit step used to `git add` only the
# two ledger files by name, so any run that actually uploaded covers left
# the CSV dirty and `git pull --rebase` failed with "you have unstaged
# changes" — silently dropping that run's ledger progress. `git add -A`
# instead of naming files avoids this recurring on the next script that
# writes a new tracked side-effect file.

on:
  schedule:
    # Top of every hour. NOTE: after changing a workflow's cron before
    # (2026-08-10), GitHub kept firing the OLD schedule for 15 days despite
    # main showing the new one — only started respecting it after a further
    # commit touched this file (2026-08-25). If runs aren't landing hourly
    # within a day of this merging, don't assume the file is wrong; check
    # `gh run list --workflow=cover-ingest.yml` for the actual fired cadence
    # and consider a workflow_dispatch or a trivial re-commit to force GitHub
    # to pick it up.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Runs are small now (minutes, not hours) — this is a hang detector,
    # not a real budget. If a run is regularly approaching this, something
    # is wrong (stuck retry loop, runaway lane) and needs investigating
    # before raising it.
    timeout-minutes: 45

    # Concurrency guard: hourly runs should each finish in a few minutes,
    # comfortably inside the hour, but if one ever runs long the next
    # scheduled trigger queues behind it rather than running in parallel
    # against the same ledger. cancel-in-progress=false means we don't kill
    # the running one mid-volume (would orphan partial uploads).
    concurrency:
      group: cover-ingest
      cancel-in-progress: false

    env:
      # Python ingester reads SUPABASE_URL (not NEXT_PUBLIC_SUPABASE_URL)
      # and SUPABASE_SERVICE_ROLE_KEY directly. COMICVINE_API_KEY is
      # required — without it the script raises on startup.
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
      # The Node health-check step at the end (checkCoverIngestHealth.js +
      # repairAllCoverSeriesLinks.js) uses the same @/lib-style env names as
      # every other scripts/*.js file, not the Python-only SUPABASE_URL above.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: no `cache: 'pip'` — setup-python@v5 requires requirements.txt
      # or pyproject.toml for cache key. We install requests + python-dotenv
      # inline (~5s on each run), so caching saves nothing and broke the job.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      # Node is only needed for the health-check step at the end
      # (checkCoverIngestHealth.js + repairAllCoverSeriesLinks.js), not the
      # Python ingester itself.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Show current ledger size
        run: |
          if [ -f .ingest-done.json ]; then
            python -c "import json; d=json.load(open('.ingest-done.json'));print(f'Ledger entries (from git): {len(d)}')"
          else
            echo "Ledger empty — starting fresh."
          fi
          if [ -f needs_volume_id.json ]; then
            python -c "import json; d=json.load(open('needs_volume_id.json'));print(f'needs_volume_id.json entries (from git): {len(d)}')"
          fi

      # Cycle: launch priority → featured → manual → pinned → width → depth.
      # --skip-existing so already-covered targets cost ~0 requests.
      # continue-on-error lets a failing step (rate-limit, transient 5xx)
      # not block the next file.
      #
      # Per-lane --max-search-calls sums to 105 (priority 15 + featured 10 +
      # manual 15 + pinned 20 + width 30 + depth 15). At the ~3x-per-match
      # real-call multiplier that's ~200-300 real calls in the worst case
      # (every attempt succeeds) — priority/featured/manual will rarely use
      # their full allowance since they're mostly already-done skips, which
      # in practice leaves width/depth more room than their caps suggest.
      # Biased toward width since that's what moves "series with any cover
      # at all" (7.5% as of 2026-08-26) — the number that actually makes the
      # catalog feel Discogs-complete instead of hollow.
      - name: Ingest launch-priority gap targets
        if: hashFiles('gap-priority.json') != ''
        continue-on-error: true
        run: python comicvine_api_to_supabase.py --targets gap-priority.json --skip-existing --max-search-calls 15 --vol-sleep 1.0

      - name: Ingest featured-gap targets
        if: hashFiles('gap-featured.json') != ''
        continue-on-error: true
        run: python comicvine_api_to_supabase.py --targets gap-featured.json --skip-existing --max-search-calls 10 --vol-sleep 1.0

      - name: Ingest manual-gap targets
        if: hashFiles('gap-manual.json') != ''
        continue-on-error: true
        run: python comicvine_api_to_supabase.py --targets gap-manual.json --skip-existing --max-search-calls 15 --vol-sleep 1.0

      # Targets with a confirmed volume_id (see resolveNeedsVolumeIdBacklog.js)
      # — fetches the ComicVine volume directly by id, skipping the fuzzy
      # title/publisher search that failed for these in the first place.
      - name: Ingest pinned-volume targets
        if: hashFiles('gap-pinned.json') != ''
        continue-on-error: true
        run: python comicvine_api_to_supabase.py --targets gap-pinned.json --skip-existing --max-search-calls 20 --vol-sleep 1.0

      - name: Ingest width-gap targets
        if: hashFiles('gap-width.json') != ''
        continue-on-error: true
        run: python comicvine_api_to_supabase.py --targets gap-width.json --skip-existing --max-search-calls 30 --vol-sleep 1.0

      - name: Ingest depth-gap targets
        if: hashFiles('gap-depth.json') != ''
        continue-on-error: true
        run: python comicvine_api_to_supabase.py --targets gap-depth.json --skip-existing --max-search-calls 15 --vol-sleep 1.0

      # Runs for real (not --dry-run) so any mis-tagged volumes from this
      # run's own ingestion get fixed automatically instead of waiting for
      # a human to see a failure email and run this by hand. Uses the same
      # 85%-overlap / 15-point-margin scoring already proven safe across
      # four repair passes this month. continue-on-error so a transient
      # Supabase hiccup here doesn't block the ledger commit below — the
      # health check afterward still catches anything left mis-linked.
      - name: Auto-repair mis-linked volumes
        if: always()
        continue-on-error: true
        run: node scripts/repairAllCoverSeriesLinks.js

      - name: Final ledger size
        if: always()
        run: |
          if [ -f .ingest-done.json ]; then
            python -c "import json; d=json.load(open('.ingest-done.json'));print(f'Ledger entries (after this run): {len(d)}')"
          fi
          if [ -f needs_volume_id.json ]; then
            python -c "import json; d=json.load(open('needs_volume_id.json'));print(f'needs_volume_id.json entries (after this run): {len(d)}')"
          fi

      # git add -A, not named files: comicvine_api_to_supabase.py rewrites
      # comicvine_api_output/issues_uploaded.csv (a git-tracked file) on
      # every invocation. Naming only the two ledger files here left that
      # CSV dirty on any run that actually uploaded covers, which then
      # failed `git pull --rebase` with "you have unstaged changes" and
      # silently dropped the whole run's progress (first hit 2026-08-26).
      - name: Commit ledger updates
        if: always()
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "cover-ingest: ledger update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase
          git push

      # No continue-on-error here on purpose — this is the one step in the
      # whole job allowed to fail it. Everything above stays green even on
      # a totally unproductive run; this is what turns that into a real,
      # noticed failure (GitHub's default failure-notification email).
      # --lookback-days=1, not the 8-day default: that default was sized for
      # the old weekly cadence, where 8 days of silence meant "the last
      # cycle failed." Hourly runs should add something almost every day
      # under normal operation, so 24 hours of total silence is already a
      # meaningful signal something broke — no reason to wait a week to
      # find out.
      - name: Check pipeline health (stall)
        if: always()
        run: node scripts/checkCoverIngestHealth.js --mode=stall --lookback-days=1

      - name: Check pipeline health (mis-linked volumes)
        if: always()
        run: node scripts/checkCoverIngestHealth.js --mode=mislink
