name: Cron watchdog

# GitHub Actions' `schedule:` trigger has silently failed to fire on this
# repo four separate times now (Instagram, cover-ingest, and now
# weekly-refresh/gap-probe on 2026-08-31 — the cover-ingest pipeline ran dry
# because its weekly gap-list regeneration just didn't fire, and the health
# check correctly flagged it as a real stall). Rather than re-discovering
# and re-patching this per workflow, this runs frequently and cheaply
# (a couple of API calls, no checkout) and force-triggers any watched
# workflow whose last success is older than its expected cadence + a grace
# window. See scripts/cronWatchdog.js for the actual check.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/cronWatchdog.js
          sparse-checkout-cone-mode: false

      - name: Check watched workflows and re-trigger if overdue
        run: node scripts/cronWatchdog.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # The run goes red when a watched job is stuck (see cronWatchdog.js).
      # Email once a day (the 12:00 UTC run) or on a manual run, so a stuck
      # job is heard about without an email every six hours.
      - name: Email the reports address about stuck jobs
        if: failure() && hashFiles('watchdog-stuck.txt') != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          REPORTS_NOTIFY_EMAIL: ${{ secrets.REPORTS_NOTIFY_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$(date -u +%H)" != "12" ]; then
            echo "Stuck jobs reported in the log; the email goes out with the 12:00 UTC run."
            exit 0
          fi
          jq -n --arg from "$RESEND_FROM_EMAIL" --arg to "$REPORTS_NOTIFY_EMAIL" --arg url "$RUN_URL" --rawfile stuck watchdog-stuck.txt \
            '{from: $from, to: $to, subject: "ComixCatalog: a scheduled job keeps failing", text: ("These jobs have not succeeded in at least two of their usual windows. Retrying has not fixed them, so something needs a look.\n\n" + $stuck + "\nRun: " + $url)}' \
            | curl -sS --fail-with-body -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d @-
