name: Gap probe (weekly)

# Weekly auto-discovery of volumes the cover-ingest should know about.
# Runs Mondays 08:00 UTC and on manual dispatch. Three sources:
#   1. scripts/probeNewReleases.js  — last 14 days of CV releases, allowlisted
#      publishers, dedupes against canonical_covers + gap-manual.
#   2. scripts/generateUserCollectedGap.js --append-to-manual — any series
#      a user added to their collection that we still lack coverage for.
#   3. scripts/resolveNeedsVolumeIdBacklog.js — walks needs_volume_id.json
#      (series where ComicVine's search returned exactly one same-titled
#      candidate under a different publisher than GCD's) and pins
#      series.comicvine_volume_id + appends to gap-pinned.json for anything
#      unambiguous. Added 2026-08-26 — this backlog had grown to 745 entries
#      with nothing ever consuming it.
#
# (1) and (2) append directly into gap-manual.json; (3) writes gap-pinned.json
# and prunes resolved entries from needs_volume_id.json. On commit, the next
# scheduled cover-ingest cycle picks all of it up. No human in the loop
# required.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --no-audit --no-fund

      - name: Probe ComicVine for recent releases (14 days)
        run: node scripts/probeNewReleases.js --days=14 --apply

      - name: Probe user-collected series with no canonical coverage
        run: node scripts/generateUserCollectedGap.js --append-to-manual
        continue-on-error: true

      - name: Resolve single-candidate volume-id backlog
        run: node scripts/resolveNeedsVolumeIdBacklog.js
        continue-on-error: true

      - name: Commit gap-manual / gap-pinned additions
        run: |
          if [[ -z "$(git status --porcelain gap-manual.json gap-pinned.json needs_volume_id.json)" ]]; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gap-manual.json gap-pinned.json needs_volume_id.json
          git commit -m "gap-manual: weekly auto-append (new releases + user-collected + resolved pins)"
          git push
