name: GCD issue refresh (weekly)

# Targeted top-up of gcd_issues from GCD's own live API - NOT a fresh bulk
# dump. Our gcd_issues mirror was populated once from an old GCD Postgres
# dump and never refreshed, so ongoing series silently fall behind (confirmed
# 2026-08-10: Absolute Superman's real run already had 22 issues on GCD's
# live site; our mirror only had 10). scripts/refreshGcdIssuesFromApi.js
# fetches each series' current issue list directly from comics.org/api/ and
# inserts only what's missing.
#
# Runs before cover-ingest.yml (Wednesday) so any newly-discovered issues
# already exist in gcd_issues by the time that workflow tries to match
# covers against them - covers can't attach to an issue we don't know about.
#
# Scope is deliberately narrow for now (--source=featured, ~79 series max):
# GCD's public API rate limit is real, tight, and undocumented - it tripped
# during manual testing on 2026-08-10 after well under 100 requests, with a
# Retry-After in the tens of minutes. Widening scope to the full catalog is
# a later step once this has run cleanly a few times and the actual
# sustained rate is better understood - not something to guess at upfront.
#
# Audited 2026-09-23: it had NOT in fact run cleanly. Every run since the job
# was created ended on GCD's 429 after roughly 29 requests, which is normal
# and expected - but the walk order was fixed, so each weekly run spent that
# budget on the same first few series and the rest of the list was never
# reached. On top of that the candidate lookup was truncated at PostgREST's
# 1000-row cap, which dropped 9 featured entries outright (all five Absolute
# titles among them) and pointed 20 more at a different series than intended.
# The job reported success through all of it, because its only real step was
# wrapped in `continue-on-error: true`.
#
# Now: the lookup is paginated, the run rotates through the list via a
# committed cursor, and only GCD's 429 is translated to success.
#
# Still open: at ~29 requests a week against a 78-series list, a full pass
# takes about three weeks. Running this daily would fix that and is still
# trivial traffic for comics.org, but that is a deliberate decision about
# someone else's volunteer-run server, so it stays weekly until asked.
#
# To trigger manually: Actions tab → GCD issue refresh → Run workflow.

on:
  schedule:
    # Wednesday 18:00 UTC - two hours before cover-ingest.yml (20:00 UTC),
    # same day as US new releases, giving GCD's volunteer indexers some
    # runway first. Adjust once real data shows same-day indexing lag.
    - cron: '0 18 * * 3'
  workflow_dispatch:
    inputs:
      source:
        description: 'Target source (featured = curated homepage list)'
        default: 'featured'
        required: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    concurrency:
      group: gcd-issue-refresh
      cancel-in-progress: false

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --no-audit --no-fund

      # Exit 3 = GCD returned 429, which is the expected end of nearly every
      # run (the budget is ~29 requests and the featured list is 78 series),
      # so it is translated to success. Every other non-zero exit is a real
      # failure and must go red.
      #
      # This step used to be a blanket `continue-on-error: true`, and it was
      # the job's only real step, so the workflow could not fail at all.
      # Live 2026-09-23: all four runs since 08-26 were green, and all four
      # had walked the same first four series and stopped - the 74 behind
      # them had never been refreshed, because a truncated candidate list
      # and a fixed walk order put them permanently out of reach.
      - name: Refresh featured-series issue lists from GCD
        id: refresh
        run: |
          set +e
          node scripts/refreshGcdIssuesFromApi.js --source=${{ github.event.inputs.source || 'featured' }}
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "GCD rate-limited this run (expected). The cursor records where to resume."
            echo "ratelimited=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      # The cursor is what makes the next run start somewhere new instead of
      # re-walking the same front of the list, so it has to be committed even
      # when the run ended on a 429 - especially then.
      - name: Commit the rotation cursor
        if: always() && steps.refresh.outcome != 'skipped'
        run: |
          if [[ -z "$(git status --porcelain gcd-refresh-cursor.json)" ]]; then
            echo "Cursor unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gcd-refresh-cursor.json
          git commit -m "gcd-issue-refresh: advance rotation cursor"
          # Same push race gap-probe.yml documents: several scheduled jobs
          # push to main at the end of long runs, and whichever lands second
          # is rejected with "fetch first". The file sets do not overlap, so
          # a rebase picks up the other job's commit cleanly.
          git pull --rebase origin main
          git push origin HEAD:main
