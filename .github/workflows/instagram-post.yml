name: Instagram daily post

# One real post per day — see docs/instagram-bot-plan.md for the full plan
# and the one-time Meta/Instagram account setup this depends on.
#
# Runs hourly, not once a day, even though the intent is one post/day.
# Confirmed live 2026-08-28: the single daily `0 17 * * *` firing silently
# didn't happen at all (>19h gap through the scheduled slot, no run in
# GitHub's history) — the same "treat GitHub's schedule trigger as
# best-effort, not authoritative" flakiness already documented on
# cover-ingest.yml's hourly cron. One shot a day means one missed day per
# dropped firing; running hourly gives ~24 chances for GitHub's scheduler
# to actually fire instead of 1. instagramBot.js's "already posted today"
# guard (scripts/.instagram-last-post-date.json) makes the other ~23
# firings safe no-ops rather than 23 extra posts.
#
# workflow_dispatch lets you trigger manually from the Actions tab to
# test, or to force today's post immediately if the schedule missed it.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

# Serialize runs — caught by a Codex review pass 2026-08-28 (see the
# senior-audit skill this incident became the seed case for): the
# "already posted today" guard reads scripts/.instagram-last-post-date.json
# at the START of a run, so two overlapping runs (a manual dispatch landing
# mid-way through a scheduled run, or a delayed scheduled run overlapping
# the next one) can both read the same not-yet-posted state, both pass the
# guard, and both publish before either commits its update — silently
# breaking the one-post-per-day guarantee the guard exists to enforce.
# cancel-in-progress: false (not true) — a queued run should still get its
# turn once the current one finishes and commits, not be discarded; the
# guard then correctly no-ops it if the day's post already happened.
concurrency:
  group: instagram-post
  cancel-in-progress: false

# The bot commits its de-dup ledger (scripts/.instagram-posted.json) and
# last-post-date guard (scripts/.instagram-last-post-date.json) back to
# main after a successful post, same pattern as gap-manual.json.
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Configure these as repo secrets:
      #   Settings → Secrets and variables → Actions → New repository secret
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Post to Instagram
        run: node scripts/instagramBot.js

      - name: Commit updated de-dup ledger
        run: |
          git config user.name "comixcatalog-bot"
          git config user.email "actions@github.com"
          git add scripts/.instagram-posted.json scripts/.instagram-last-post-date.json
          if git diff --staged --quiet; then
            echo "Nothing to commit (guard skipped this run — already posted today)."
            exit 0
          fi
          git commit -m "instagram-bot: record posted issue"
          # Hourly cadence means this can race cover-ingest.yml's own hourly
          # commits to main — rebase onto whatever landed since checkout
          # rather than fail the push outright.
          git pull --rebase
          git push
