name: Production performance check

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

jobs:
  perf-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production budgets
        run: node scripts/perfBaseline.js --ci --out="$GITHUB_STEP_SUMMARY"
