name: PR checks

# Runs on every PR into main. This repo doesn't require PRs (see
# docs/operations/engineering-workflow.md) — direct pushes to main still
# work — but when a PR is opened, these checks gate GitHub's "auto-merge"
# so it actually waits for something before landing the change.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Read-only: none of lint/test/build/docs:check write to the database or
# need repo write access.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # `next build` prerenders some pages server-side and crashes with
      # "supabaseUrl is required" if these are unset (confirmed locally —
      # see src/lib/supabase/client.js and server.js). Both are the public
      # anon key pair already exposed to browsers in production, not the
      # service-role secret, so this workflow's blast radius stays read-only.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the lint step below can diff against the base
          # branch. A shallow (default) checkout has no merge-base to diff
          # against.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Migration safety check
        shell: bash
        run: |
          mapfile -t MIGRATIONS < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}"...HEAD -- 'scripts/migrations/*.sql')
          npm run migrations:check -- "${MIGRATIONS[@]}"

      - name: Migration safety fixture tests
        run: npm run test:migrations

      # Keep PR checks focused on the JS/JSX files the change actually
      # touches so unrelated repo-wide lint debt does not keep every PR red.
      # This is a narrower gate than the full repo lint and is intentionally
      # used for cleanup work that should not expand into a broad refactor.
      - name: Lint changed files
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}"...HEAD -- '*.js' '*.jsx')
          if [ -z "$CHANGED" ]; then
            echo "No JS/JSX changes in this PR — skipping lint."
          else
            echo "$CHANGED"
            npx eslint $CHANGED
          fi

      - name: Cover-match tests
        run: npm run test:cover-match

      - name: Cover-scan tests
        run: npm run test:cover-scan

      - name: Review queue tests
        run: npm run test:review

      - name: Admin two-factor tests
        run: npm run test:admin-aal

      - name: Cover resolver tests
        run: npm run test:covers

      - name: Supabase pagination tests
        run: npm run test:fetch-all

      - name: Creator page tests
        run: npm run test:creator-page

      - name: Fetch retry tests
        run: npm run test:fetch-with-retry

      - name: Year helper tests
        run: npm run test:years

      - name: Activity feed privacy tests
        run: npm run test:activity-feed

      - name: Library mutation tests
        run: npm run test:library-mutations

      - name: Chunk helper tests
        run: npm run test:chunk

      - name: GCD format-sync retry tests
        run: npm run test:format-sync

      - name: GCD creator-credit parsing tests
        run: npm run test:gcd-credits

      - name: Instagram dedupe tests
        run: npm run test:instagram

      - name: Health-check failure-mode tests
        run: npm run test:health-check

      - name: Catalog duplicate-check tests
        run: npm run test:contribute-match

      - name: Barcode / printing tests
        run: npm run test:printings

      - name: Search query-parsing tests
        run: npm run test:search-query

      - name: Search variety tests
        run: npm run test:search-variety
      - name: Password policy tests
        run: npm run test:password-policy

      - name: Build
        run: npm run build

      - name: Error-handling ratchet
        run: npm run audit:errors

      - name: describeError tests
        run: npm run test:describe-error

      - name: Transient-retry tests
        run: npm run test:with-retry

      - name: Volume-resolver tests
        run: npm run test:resolve-by-year

      - name: Cover thumb URL tests
        run: npm run test:cover-thumb

      - name: Browser cache helper tests
        run: npm run test:local-cache

      - name: Marketplace listing row tests
        run: npm run test:listing-row

      - name: Marketplace listing sync tests
        run: npm run test:listing-sync

      - name: Marketplace order tests
        run: npm run test:orders

      - name: Marketplace seller tests
        run: npm run test:marketplace-sellers

      - name: Marketplace checkout tests
        run: npm run test:marketplace-checkout

      - name: Marketplace order page tests
        run: npm run test:marketplace-orders-ui

      - name: Marketplace feedback tests
        run: npm run test:marketplace-feedback

      - name: Marketplace dispute and refund tests
        run: npm run test:marketplace-disputes

      - name: Marketplace fraud tests
        run: npm run test:marketplace-fraud

      - name: Marketplace database tests
        run: npm run test:db

      - name: Listing photo tests (rules + EXIF stripping)
        run: npm run test:listing-photos

      - name: Listing edit rules tests
        run: npm run test:listing-edit

      - name: Value history chart tests
        run: npm run test:value-history

      - name: Marketplace filter tests
        run: npm run test:marketplace-facets

      - name: Follow rule tests
        run: npm run test:follows

      - name: Valuation tests
        run: npm run test:valuation

      - name: eBay comp matching tests
        run: npm run test:comp-match

      - name: JSON-LD escaping tests
        run: npm run test:json-ld

      - name: Activation nudge tests
        run: npm run test:activation-nudges

      - name: Docs link check
        run: npm run docs:check
