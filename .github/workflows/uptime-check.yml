name: Uptime check
# Alert-path tests get their own run title so the checker can leave them out
# of the up/down history (otherwise a test "failure" triggers a fake Recovered).
run-name: ${{ inputs.uptime_url && 'Uptime check (alert test)' || 'Uptime check' }}
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      uptime_url:
        description: Health URL override for an alert-path test only
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            scripts/uptimeCheck.js
          sparse-checkout-cone-mode: false
      - name: Check site and database
        run: node scripts/uptimeCheck.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          REPORTS_NOTIFY_EMAIL: ${{ secrets.REPORTS_NOTIFY_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          UPTIME_URL: ${{ inputs.uptime_url }}
